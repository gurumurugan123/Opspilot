name: OpsPilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & SRE Benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django Migrations Up to Date
        run: |
          python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: api.settings

      - name: Ingest SRE Runbooks into Vector Store
        run: |
          python manage.py migrate
          python manage.py ingest_runbooks
        env:
          DJANGO_SETTINGS_MODULE: api.settings

      - name: Run Full Regression Test Suite (62 Tests)
        run: |
          python manage.py test tests -v 2
        env:
          DJANGO_SETTINGS_MODULE: api.settings

      - name: Run SRE Incident Evaluation Benchmark (Target >= 80% Accuracy)
        run: |
          python eval/run_eval.py
        env:
          DJANGO_SETTINGS_MODULE: api.settings

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-python-${{ matrix.python-version }}
          path: |
            eval/benchmark_report.json
            eval/benchmark_summary.md
