apiVersion: v1
kind: Secret
metadata:
  name: payments-secret
  namespace: opspilot-demo
type: Opaque
stringData:
  DB_PASSWORD: "opspilot_secret"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: opspilot-demo
data:
  DB_HOST: "postgres"
  DB_NAME: "opspilot"
  DB_USER: "opspilot"
  DB_PORT: "5432"
  SIMULATE_500: "false"
  TRIGGER_OOM: "false"
  TRIGGER_CPU_SPIKE: "false"
  SIMULATE_SLOW_QUERY: "false"
  FAIL_READINESS_PROBE: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: opspilot-demo
  labels:
    app: payments-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
    spec:
      containers:
        - name: payments-service
          image: opspilot/payments-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: payments-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: payments-service
  namespace: opspilot-demo
spec:
  selector:
    app: payments-service
  ports:
    - port: 8000
      targetPort: 8000
