  - id: "scenario-10-jenkins-pytest-failure"
    name: "Jenkins CI Build Unit Test Failure"
    namespace: "opspilot-demo"
    service_hint: "orders-build"
    query: "Jenkins build #45 failed during unit test execution in CI/CD pipeline."
    expected_root_cause_keywords: ["jenkins", "test"]
    expected_runbook: "runbook_crashloopbackoff.md"
    mock_telemetry:
      get_jenkins_builds:
        build_count: 2
        builds:
          - number: 45
            result: "FAILURE"
            duration_ms: 12000
          - number: 44
            result: "SUCCESS"
            duration_ms: 11000
      get_jenkins_build_log:
        job: "orders-build"
        build_number: 45
        log: "FAILED tests/test_orders.py::test_create_order - AssertionError: Expected status 201 but got 400"
      get_build_changes:
        job: "orders-build"
        build_number: 45
        changes:
          - commit: "a1b2c3d"
            author: "dev@company.internal"
            message: "Refactor order validation schema"
      search_runbooks:
        results:
          - source_file: "runbook_crashloopbackoff.md"
            section: "Triage"
            score: 0.04

  - id: "scenario-11-jenkins-docker-push-unauthorized"
