    namespace: "opspilot-demo"
    service_hint: "payments-build"
    query: "Jenkins CI build failed while publishing Docker container image."
    expected_root_cause_keywords: ["jenkins", "docker"]
    expected_runbook: "runbook_imagepullbackoff.md"
    mock_telemetry:
      get_jenkins_builds:
        build_count: 1
        builds:
          - number: 78
            result: "FAILURE"
            duration_ms: 35000
      get_jenkins_build_log:
        job: "payments-build"
        build_number: 78
        log: "docker push registry.internal/payments:v1.4\ndenied: requested access to the resource is denied (401 Unauthorized)"
      get_build_changes:
        job: "payments-build"
        build_number: 78
        changes:
          - commit: "f9e8d7c"
            author: "dev@company.internal"
            message: "Bump base image version"
      search_runbooks:
        results:
          - source_file: "runbook_imagepullbackoff.md"
            section: "Registry Authentication"
            score: 0.04

