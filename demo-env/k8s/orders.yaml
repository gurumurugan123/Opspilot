apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: opspilot-demo
data:
  INVENTORY_SERVICE_URL: "http://inventory-service:8000"
  PAYMENTS_SERVICE_URL: "http://payments-service:8000"
  DOWNSTREAM_TIMEOUT: "3.0"
  FAIL_READINESS_PROBE: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: opspilot-demo
  labels:
    app: orders-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: opspilot/orders-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: orders-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: opspilot-demo
spec:
  selector:
    app: orders-service
  ports:
    - port: 8000
      targetPort: 8000
