version: "1.0"
benchmark_suite: "OpsPilot SRE Incident Diagnostic Benchmark"
scenarios:
  - id: "scenario-01-crashloop-missing-env"
    name: "Orders Service CrashLoopBackOff Missing Config"
    namespace: "opspilot-demo"
    service_hint: "orders-service"
    query: "Orders service is crashing on startup with CrashLoopBackOff."
    expected_root_cause_keywords: ["crashloop", "keyerror"]
    expected_runbook: "runbook_crashloopbackoff.md"
    mock_telemetry:
      list_pods:
        pod_count: 1
        pods:
          - name: "orders-service-1"
            status: "CrashLoopBackOff"
            ready: "0/1"
            restarts: 4
      get_k8s_events:
        event_count: 1
        events:
          - type: "Warning"
            reason: "BackOff"
            object: "pod/orders-service-1"
            message: "Back-off restarting failed container"
      describe_pod:
        containers:
          - name: "orders-service"
            last_termination:
              reason: "Error"
              exit_code: 1
              message: "KeyError: 'DATABASE_URL' missing"
      get_pod_logs:
        logs: "KeyError: 'DATABASE_URL' is missing in environment variables\nTraceback (most recent call last):\n  File 'manage.py', line 22"
      get_recent_deployments:
        deployments: []
      search_runbooks:
        results:
          - source_file: "runbook_crashloopbackoff.md"
            section: "Triage Steps"
            score: 0.05

  - id: "scenario-02-oomkilled-memory-spike"
    name: "Payments Service OOMKilled Memory Limit"
    namespace: "opspilot-demo"
    service_hint: "payments-service"
    query: "Payments service was terminated with exit code 137."
    expected_root_cause_keywords: ["oomkilled", "137"]
    expected_runbook: "runbook_oomkilled.md"
    mock_telemetry:
      list_pods:
        pod_count: 1
        pods:
          - name: "payments-service-1"
            status: "OOMKilled"
            ready: "0/1"
            restarts: 2
      get_k8s_events:
        event_count: 1
        events:
          - type: "Warning"
            reason: "OOMKilled"
            object: "pod/payments-service-1"
            message: "Container payments-service exceeded its memory limit (64Mi)"
      describe_pod:
        containers:
          - name: "payments-service"
            last_termination:
              reason: "OOMKilled"
              exit_code: 137
              message: "Container exceeded configured memory limit 64Mi"
      get_pod_logs:
        logs: "Memory limit exceeded: 67108864 bytes allocated. Kernel invocation killed process (exit code 137)."
      get_recent_deployments:
        deployments: []
      search_runbooks:
        results:
          - source_file: "runbook_oomkilled.md"
            section: "Diagnosis"
            score: 0.05

  - id: "scenario-03-imagepullbackoff-invalid-tag"
    name: "Orders Service ImagePullBackOff Bad Tag"
    namespace: "opspilot-demo"
    service_hint: "orders-service"
    query: "New orders deployment cannot start due to ImagePullBackOff."
    expected_root_cause_keywords: ["imagepullbackoff"]
    expected_runbook: "runbook_imagepullbackoff.md"
    mock_telemetry:
      list_pods:
        pod_count: 1
        pods:
          - name: "orders-service-1"
            status: "ImagePullBackOff"
            ready: "0/1"
            restarts: 0
      get_k8s_events:
        event_count: 1
        events:
          - type: "Warning"
            reason: "Failed"
            object: "pod/orders-service-1"
            message: "Failed to pull image 'orders:v2.99-notfound': manifest unknown"
      describe_pod:
        containers:
          - name: "orders-service"
            current_state:
              reason: "ImagePullBackOff"
      get_pod_logs:
        logs: "rpc error: code = NotFound desc = failed to pull image 'orders:v2.99-notfound': manifest unknown"
      get_recent_deployments:
        deployments:
          - name: "orders-service"
            revision: 5
            unavailable_replicas: 1
      search_runbooks:
        results:
          - source_file: "runbook_imagepullbackoff.md"
            section: "Rollback Procedure"
            score: 0.05

  - id: "scenario-04-bad-db-host-psycopg-error"
    name: "Payments Service Bad DB Host Resolution"
    namespace: "opspilot-demo"
    service_hint: "payments-service"
    query: "Checkout returning 500 errors on payments endpoint."
    expected_root_cause_keywords: ["db_host", "postgres"]
    expected_runbook: "runbook_bad_db_host.md"
    mock_telemetry:
      list_pods:
        pod_count: 1
        pods:
          - name: "payments-service-1"
            status: "Running"
            ready: "1/1"
            restarts: 0
      get_k8s_events:
        event_count: 0
        events: []
      describe_pod:
        containers:
          - name: "payments-service"
      get_pod_logs:
        logs: "psycopg.OperationalError: could not translate host name 'postgres-wrong-address.internal' to address: Name or service not known"
      get_recent_deployments:
        deployments: []
      search_runbooks:
        results:
          - source_file: "runbook_bad_db_host.md"
            section: "Troubleshooting Steps"
            score: 0.04

  - id: "scenario-05-redis-connection-refused"
    name: "Inventory Service Redis Connection Refused"
