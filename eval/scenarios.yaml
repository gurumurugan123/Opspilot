  - id: "scenario-09-crashloop-missing-secret"
    name: "Payments CrashLoop Missing Secret"
    namespace: "opspilot-demo"
    service_hint: "payments-service"
    query: "Payments service failing on initialization with CrashLoopBackOff."
    expected_root_cause_keywords: ["crashloop", "error"]
    expected_runbook: "runbook_crashloopbackoff.md"
    mock_telemetry:
      list_pods:
        pod_count: 1
        pods:
          - name: "payments-service-1"
            status: "CrashLoopBackOff"
