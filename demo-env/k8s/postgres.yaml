apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: opspilot-demo
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "opspilot"
            - name: POSTGRES_USER
              value: "opspilot"
            - name: POSTGRES_PASSWORD
              value: "opspilot_secret"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: opspilot-demo
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
