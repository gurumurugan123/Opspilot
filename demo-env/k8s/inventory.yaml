apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: opspilot-demo
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REQUIRE_REDIS: "false"
  FAIL_READINESS_PROBE: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: opspilot-demo
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: opspilot/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: inventory-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: opspilot-demo
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8000
      targetPort: 8000
