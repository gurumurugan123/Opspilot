            status: "Running"
            ready: "1/1"
            restarts: 0
      get_k8s_events:
        event_count: 0
        events: []
      describe_pod:
        containers:
          - name: "inventory-service"
      get_pod_logs:
        logs: "redis.exceptions.ConnectionError: CRITICAL: Failed to connect to Redis at unreachable-redis.internal:6379 - Connection Refused"
      get_recent_deployments:
        deployments: []
      search_runbooks:
        results:
          - source_file: "runbook_redis_connection.md"
            section: "Remediation"
            score: 0.04

  - id: "scenario-06-readiness-probe-failure"
    name: "Orders Service Readiness Probe HTTP 500"
    namespace: "opspilot-demo"
    service_hint: "orders-service"
    query: "Orders pod unready 0/1; readiness probe failing."
